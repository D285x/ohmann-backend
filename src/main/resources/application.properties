spring.application.name=ohmann
# Render injects PORT; locally it falls back to 8080
server.port=${PORT:8080}

# ---- Database ----
# Local default: MySQL on localhost. On Render set DB_URL, DB_USERNAME, DB_PASSWORD
# (MySQL: jdbc:mysql://host:3306/ohmann?... , PostgreSQL: jdbc:postgresql://host:5432/db).
# To run without any database, set SPRING_PROFILES_ACTIVE=h2 (in-memory, data lost on restart).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ohmann?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# ---- JPA ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

# ---- App ----
# Comma-separated origins; wildcards allowed, e.g. https://ohmann-frontend.onrender.com,https://*.onrender.com
ohmann.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
ohmann.export-dir=${EXPORT_DIR:exports}
ohmann.optimizer.threads=${OPTIMIZER_THREADS:4}

# ---- Aero-service (optional; see /aero-service) ----
# Wraps shockFLOW (GPU CFD, https://github.com/DKrasauskas/shockFLOW) to refine a
# vehicle's drag coefficient into a Mach-indexed curve. If this service is not
# running, "refine aerodynamics" simply returns 503 and vehicles keep using their
# constant drag coefficient - nothing else in the app depends on it.
ohmann.aero.service-url=${AERO_SERVICE_URL:http://localhost:8500}
ohmann.aero.timeout-seconds=180

# ---- DevTools (only active with mvn spring-boot:run; excluded from the packaged jar) ----
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
